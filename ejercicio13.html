<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
</head>

<body>
    <script>
        const mostrarArreglo = (arr) => {
            arr.forEach((num) => {
                document.write(`${num} <br>`);
            });
        };

        const cantidad = Number(prompt("Cantidad:"));
        const misNumeros = [];

        for (let i = 0; i < cantidad; i++) {
            misNumeros.push(Number(prompt(`Número ${i + 1}:`)));
        }

        mostrarArreglo(misNumeros);
    </script>
</body>

</html>
